# Testa o app a cada envio e publica no GitHub Pages quando a branch main muda.
# Pull requests só rodam os testes. A publicação só acontece se os testes passarem.
name: Testes e publicação

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Instalar o Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rodar os testes
        run: npm test

  publicar:
    name: Publicar no GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: testes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Instalar o Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Montar o site só com os arquivos do app
        run: node ferramentas/montar-site.mjs _site
      - name: Preparar o GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar os arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: publicacao
        uses: actions/deploy-pages@v5
